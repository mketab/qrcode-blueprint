name: Publish Factorio Mod

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Publish mod via uv
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
          ALLOW_UNTAGGED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: uv run build.py upload
